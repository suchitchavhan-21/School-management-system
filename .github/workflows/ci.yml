name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Java 11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: false

      - name: Create Build Directories
        run: |
          mkdir -p build/classes
        shell: bash

      - name: Compile Sources & Test Suite (Linux)
        if: runner.os == 'Linux'
        run: |
          javac -encoding UTF-8 -cp "dist/lib/*:src" -d build/classes src/*.java test/*.java
        shell: bash

      - name: Compile Sources & Test Suite (Windows)
        if: runner.os == 'Windows'
        run: |
          javac -encoding UTF-8 -cp "dist/lib/*;src" -d build/classes src/*.java test/*.java
        shell: bash

      - name: Copy Resources to Build Directory
        run: |
          cp -r src/images build/classes/ 2>/dev/null || true
          cp src/*.png build/classes/ 2>/dev/null || true
          cp src/*.jpg build/classes/ 2>/dev/null || true
          cp src/*.form build/classes/ 2>/dev/null || true
          cp src/*.html build/classes/ 2>/dev/null || true
        shell: bash

      - name: Execute Automated Test Suite (Linux)
        if: runner.os == 'Linux'
        run: |
          java -cp "dist/lib/*:build/classes" SystemTestSuite
        shell: bash

      - name: Execute Automated Test Suite (Windows)
        if: runner.os == 'Windows'
        run: |
          java -cp "dist/lib/*;build/classes" SystemTestSuite
        shell: bash
