# School Management System - Database Configuration
# Configurable database selection: 'sqlite' (embedded standalone) or 'mysql' (network database)
db.type=sqlite
db.sqlite.file=student_database.sqlite

# MySQL Settings (Active only when db.type=mysql)
db.mysql.host=localhost
db.mysql.port=3306
db.mysql.database=student_database
db.mysql.username=root
db.mysql.password=
db.mysql.useSSL=false
