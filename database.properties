# School Management System - Database Configuration
# Configurable database selection: 'sqlite' (embedded standalone, recommended for development) or 'mysql' (network database)
db.type=sqlite
db.sqlite.file=student_database.sqlite

# MySQL Settings (Active only when db.type=mysql)
# Credentials can be securely supplied via environment variables SMS_MYSQL_USER and SMS_MYSQL_PASSWORD.
db.mysql.host=localhost
db.mysql.port=3306
db.mysql.database=student_database
db.mysql.username=
db.mysql.password=
db.mysql.useSSL=true
